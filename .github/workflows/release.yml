name: Build & Release APIxray

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make Windows Executable & Installer
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APIxray-Windows-Build
          path: |
            out/make/**/*.exe
            out/make/**/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make Linux DEB Package
        run: npm run make -- --platform=linux --arch=x64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APIxray-Linux-Build
          path: |
            out/make/**/*.deb
            out/make/**/*.zip
